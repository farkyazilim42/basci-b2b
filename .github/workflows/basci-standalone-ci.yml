name: Basci B2B Standalone CI

on:
  push:
    branches:
      - feature/standalone-mikro-fly-portal
    paths:
      - "standalone/**"
      - ".github/workflows/basci-standalone-ci.yml"
  pull_request:
    paths:
      - "standalone/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
